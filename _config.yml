# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Lukasz Kolodziej
description: "Hi I'm Lukasz, and I'm a BI Developer | Technical Business Analyst | Data Scientist.  My portfolio focuses on interesting projects I've recently undertaken, with a strong emphasis on business impact. Please visit my Github & LinkedIn pages (or download my Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#d664e3"> Portfolio </span>
location: "Malbork, Poland"
resume_url: /docs/lukasz-kolodziej-resume.pdf
avatar_image: /img/profile_pic.jpg

#-------------------------------
# Contact links
linkedln: "https://linkedin.com/in/lukasz-kolodziej-40222a129" # Add your linkedln handle
github: "https://github.com/LKOLOLEE"  # Add your github handle

paginate: 10
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


